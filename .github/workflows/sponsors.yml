name: Sponsors

on:
  release:
    types: [published]

permissions: {}

jobs:
  credit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      SPONSORS_URL: https://marcelotryle.com/sponsors/list.json
      HELP: "> This project needs your help! [Let's make this project sustainable together](https://marcelotryle.com/blog/sponsorship-fund-2027/)"

    steps:
      - name: Add the sponsorship header and the sponsor credits to the release notes
        run: |
          warn() { echo "::warning::$1"; }

          notes=$(gh release view --json body --jq .body -- "$TAG") || { warn "Could not read the release notes"; exit 0; }
          case "$notes" in "$HELP"*) exit 0 ;; esac

          credit=""
          if sponsors=$(curl --fail --silent --show-error --location --max-time 30 "$SPONSORS_URL"); then
            credit=$(jq --raw-output '
              def clean: gsub("@(?=[[:alnum:]])|#(?=[0-9])|[[:cntrl:]]"; "") | gsub("(?<c>[\\\\`*_~\\[\\]()<>|$])"; "\\\(.c)") | gsub("^\\s+|\\s+$"; "");
              [
                (.partners + .supporters)[]
                | (((.name // "" | clean) | select(. != "")) // (.login // "" | clean)) as $name
                | select($name != "")
                | if (.url // "" | test("^https?://[^\\s()<>\\[\\]\\\\\"`]+$")) then "[\($name)](\(.url))" else $name end
              ] | join(", ")
            ' <<<"$sponsors") || { warn "Sponsors not credited: could not parse the sponsor list"; credit=""; }
          else
            warn "Sponsors not credited: could not fetch the sponsor list"
          fi
          [ -z "$credit" ] || notes=$(printf '%s\n\n**Sponsors:** %s' "$notes" "$credit")

          printf '%s\n\n%s\n' "$HELP" "$notes" | gh release edit --notes-file - -- "$TAG" \
            || warn "Could not edit the release notes"
